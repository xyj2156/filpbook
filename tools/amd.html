<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>flipbook · amd dist harness</title>
    <style>
      html, body { margin: 0; height: 100%; background: #26262a; }
      body { display: grid; place-items: center; font: 14px/1.5 system-ui, sans-serif; }
      #stage { position: relative; width: 800px; height: 600px; }
      .probe { position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 8px; color: #eee; }
      .probe b { font-size: 40px; font-weight: 600; }
      #info { position: fixed; left: 12px; top: 8px; color: #bbb; font: 13px system-ui; }
    </style>
  </head>
  <body>
    <div id="info">AMD 加载中…</div>
    <div id="stage"></div>
    <!-- 取证页：用真 AMD 加载器（CDN requirejs）消费本地构建产物 dist/amd -->
    <script src="https://cdn.jsdelivr.net/npm/requirejs@2.3.7/require.js"></script>
    <script>
      require.config({
        nodeIdCompat: true, // tsc 的 AMD 产物相对依赖带 .js 后缀，需剥掉再拼 URL
        packages: [{
          name: 'filpbook-core',
          location: '/packages/core/dist/amd',
          main: 'index'
        }]
      })
      require(['filpbook-core'], function (fb) {
        var book = new fb.FlipBook(document.getElementById('stage'), {
          pageCount: 6, width: 400, height: 600
        })
        for (var p = 1; p <= book.total; p++) {
          var host = book.hostOf(p)
          host.style.background = 'hsl(' + ((p * 26) % 360) + ' 40% ' + (p % 2 ? 28 : 40) + '%)'
          host.innerHTML = '<div class="probe"><b>第 ' + p + ' 页</b><span>amd dist</span></div>'
        }
        var info = document.getElementById('info')
        info.textContent = 'AMD OK · FlipBook ' + (typeof fb.FlipBook) + ' · total ' + book.total
        window.__amdReady = true
      }, function (err) {
        document.getElementById('info').textContent = 'AMD FAIL: ' + (err && err.message || err)
      })
    </script>
  </body>
</html>
